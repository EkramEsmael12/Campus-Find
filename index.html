<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus-Find | Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Campus-Find</h1>
        <p>Find what you've lost. Return what you've found.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to Campus-Find!</h2>
            <p>A campus lost and found platform.</p>
            <button id="lostBtn">Report Lost Item</button>
            <button id="foundBtn">Report Found Item</button>
        </section>

        <section>
            <h2>Recently Reported Items</h2>
            <div id="items">
                <p>No items reported yet.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus-Find. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
